server:
  port: 0

springdoc:
  api-docs:
    path: /accion-service/api-docs
  swagger-ui:
    path: /doc/swagger-ui/index.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: accion-service
  flyway:
    enabled: 'true'
    baseline-on-migrate: 'true'
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_accion_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    show-sql: 'true'
    hibernate:
      ddl-auto: update