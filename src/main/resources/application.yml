server:
  port:0

springdoc:
  api-docs:
    path: /inventario_gestion/api-docs
  swagger-ui:
  path: /doc/swagger-ui/index.html

eureka:
    client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ #cambiarlo u confirmalo mas adelante

spring:
  application:
    name: inventario_gestion-service
  flyway:
     enabled: 'true'
     baseline-on-migrate: 'true'
     
  jpa:
    show-sql: 'true'

  profiles:
    active: dev 

  --- 

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_gestion_tienda_dev?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: update

  ---

    spring:
      config:
        activate:
          on-profile: test
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_gestion_tienda_test?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: update

  ---

  spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/db_gestion_tienda_prod?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: none
