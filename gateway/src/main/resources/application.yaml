server:
  port: 8080

spring:
  application:
    name: gateway


  cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: mascota-service
                uri: http://127.0.0.1:8081
                predicates:
                  - Path=/api/v1/mascota/**
                  
              - id: tipo-mascota-service
                uri: http://127.0.0.1:8081
                predicates:
                  - Path=/api/v1/tipomascota/**

              - id: usuario-service
                uri: http://127.0.0.1:8082
                predicates:
                  - Path=/api/v1/usuario/**

            #ejemplo de estructura
             # - id: nombredebloque -> id es solo para identidicar ruta
             #  uri: http://127.0.0.1:8083
             #  predicates:
             #    - Path=/api/v1/nombre/**