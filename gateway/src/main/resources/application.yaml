server:
  port: 8080

spring:
  application:
    name: gateway


  cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: mascota-service
                uri:  lb://mascota-service
                predicates:
                  - Path=/api/v1/mascota/**, /mascota-service/api-docs/**
                  
              - id: tipo-mascota
                uri: lb://mascota-service
                predicates:
                  - Path=/api/v1/tipomascota/**, /mascota-service/api-docs/**

              - id: usuario-service
                uri: lb://usuario-service
                predicates:
                  - Path=/api/v1/usuario/**, /usuario-service/api-docs/**

              - id: inventario-service
                uri: lb://inventario-service
                predicates:
                  - Path=/api/v1/inventario/**, /inventario-service/api-docs/**

              - id: tienda-service
                uri: lb://tienda-service
                predicates:
                  - Path=/api/v1/tienda/**, /tienda-service/api-docs/**

              - id: accion-service
                uri: lb://accion-service
                predicates:
                  - Path=/api/v1/accion/**, /accion-service/api-docs/**


springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - name: Microservicio mascota-service
        url: /mascota-service/api-docs

      - name: Microservicio usuario-service
        url: /usuario-service/api-docs
        
      - name: Microservicio inventario-service
        url: /inventario-service/api-docs

      - name: Microservicio accion-service
        url: /accion-service/api-docs

      - name: Microservicio tienda-service
        url: /tienda-service/api-docs
  api-docs:
    enabled: true