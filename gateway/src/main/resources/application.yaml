server:
  port: 8080

spring:
  application:
    name: gateway


  cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: mascota-service
                uri:  lb://mascota-service
                predicates:
                  - Path=/api/v1/mascota/**, /mascota-service/api-docs/**
                  
              - id: tipo-mascota-service
                uri: lb://mascota-service
                predicates:
                  - Path=/api/v1/tipomascota/**, /mascota-service/api-docs/**

              - id: usuario-service
                uri: lb://usuario-service
                predicates:
                  - Path=/api/v1/usuario/**, /usuario-service/api-docs/**

              - id: tienda-gestion-service
                uri: lb://tienda_gestion-service
                predicates:
                  - Path=/api/v1/tienda/**, /api/v1/tiendaItem/**, /tienda_gestion/api-docs/**

              - id: inventario-gestion-service
                uri: lb://inventario_gestion-service
                predicates:
                  - Path=/api/v1/inventario/**, /api/v1/item/**, /inventario_gestion/api-docs/**


springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - name: Microservicio mascota-service
        url: /mascota-service/api-docs
      - name: Microservicio usuario-service
        url: /usuario-service/api-docs
      - name: Microservicio tienda-service
        url: /tienda_gestion/api-docs
      - name: Microservicio inventario-service
        url: /inventario_gestion/api-docs
  api-docs:
    enabled: true
