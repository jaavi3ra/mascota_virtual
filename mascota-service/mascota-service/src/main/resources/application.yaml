server:
  port: '8081'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /doc/swagger-ui/index.html

spring:
  application:
    name: mascota-service
  flyway:
    enabled: 'true'
    baseline-on-migrate: 'true'
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'

  profiles:
    active: dev 
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: root
    url: jdbc:mysql://localhost:3306/mascota_db?createDatabaseIfNotExist=true
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
  jpa:
    hibernate:
      ddl-auto: update # Permitimos que actualice localmente si es necesario
